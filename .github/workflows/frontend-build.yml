name: Frontend build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: tlg-demo-build
          path: dist/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tlg-interface-previews
          path: test-results/previews/
          if-no-files-found: ignore
          retention-days: 14
